[workspace]
members = ["crates/broker-ports", "crates/alpaca-stream"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lqepoch/broker-connectors"

[workspace.dependencies]
broker-ports = { path = "crates/broker-ports", version = "=0.1.0" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures-util = "=0.3.34"
market-contracts = { git = "https://github.com/lqepoch/trading-core.git", rev = "4230418f7fe25f70e3011fed2ba7eb59c7e4d875", version = "=0.1.0" }
rmpv = "=1.3.1"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
